name: Update FOSS PRs

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch merged PRs from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: 'Nut2026'
        run: |
          cat > fetch-prs.cjs << 'EOF'
          const fs = require('fs');
          const https = require('https');

          const username = process.env.GITHUB_USERNAME;
          const token = process.env.GH_TOKEN;

          const queries = [
            `is:merged type:pr repo:vscode-icons/vscode-icons base:master`,
            `is:merged type:pr repo:h0tp-ftw/ankimon base:main`
          ];

          function apiGet(path) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path,
                method: 'GET',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'portfolio-pr-updater',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode !== 200) {
                    return reject(new Error(`API failed (${res.statusCode}) for ${path}: ${data}`));
                  }
                  resolve(JSON.parse(data));
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function fetchQuery(query) {
            const data = await apiGet(
              `/search/issues?q=${encodeURIComponent(query)}&sort=created&order=desc&per_page=100`
            );
            return data.items;
          }

          async function prHasMyCommit(repo, prNumber) {
            let page = 1;
            while (true) {
              const commits = await apiGet(
                `/repos/${repo}/pulls/${prNumber}/commits?per_page=100&page=${page}`
              );
              if (!Array.isArray(commits) || commits.length === 0) return false;
              if (commits.some(c => c.author && c.author.login === username)) return true;
              if (commits.length < 100) return false; // last page
              page++;
            }
          }

          (async () => {
            try {
              const results = await Promise.all(queries.map(q => fetchQuery(q)));
              const allItems = results.flat();

              const seen = new Set();
              const uniqueItems = [];
              for (const item of allItems) {
                if (item.pull_request?.merged_at && !seen.has(item.html_url)) {
                  seen.add(item.html_url);
                  uniqueItems.push(item);
                }
              }

              const mergedPRs = [];
              for (const item of uniqueItems) {
                const repo = item.repository_url.replace('https://api.github.com/repos/', '');

                // Already authored by you? Keep without extra API call.
                let keep = item.user?.login === username;

                // Otherwise, check if any commit in the PR is authored by you.
                if (!keep) {
                  try {
                    keep = await prHasMyCommit(repo, item.number);
                  } catch (e) {
                    console.error(`Skipping PR #${item.number} (${repo}): ${e.message}`);
                    keep = false;
                  }
                }

                if (keep) {
                  mergedPRs.push({
                    title: item.title,
                    url: item.html_url,
                    number: item.number,
                    repo,
                    created_at: item.created_at,
                    merged_at: item.pull_request.merged_at,
                    comments: item.comments
                  });
                }
              }

              mergedPRs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              fs.writeFileSync('prs.json', JSON.stringify(mergedPRs, null, 2));
              console.log(`Fetched ${mergedPRs.length} merged PRs (authored by or containing commits from ${username}).`);
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          })();
          EOF
          node fetch-prs.cjs

      - name: Commit and push prs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prs.json
          if git diff --staged --quiet; then
            echo "No changes to prs.json, skipping commit."
          else
            git commit -m "chore: update FOSS PRs [skip ci]"
            git push
          fi
